name: Deploy to GitHub Pages

# Runs only on pushes to main (and by hand), never on pull requests:
# untrusted PR code must not run with write access.
on:
  push:
    branches: [main]
  workflow_dispatch:

# the same group as pr-preview-publish.yml: pushes to gh-pages never overlap
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions pinned by commit SHA (checkout v4, setup-node v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages
          path: pages

      - name: Publish build to gh-pages
        run: |
          set -euo pipefail
          # keeps .nojekyll and CNAME: both come from static/ and are part of build/;
          # keeps the pull request previews (pr-preview-publish.yml) in previews/
          rsync -a --delete --exclude='.git' --exclude='/previews/' build/ pages/
          cd pages
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
